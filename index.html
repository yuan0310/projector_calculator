<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projection Slice Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Projection Slice Calculator</h1>
            <p class="subtitle">Physical Dimensions to Optimized Projector Resolution</p>
        </header>

        <main>
            <!-- 1. Global Setup Section (Top) -->
            <section class="config-section card">
                <div class="config-header">
                    <h2>Project Configuration</h2>
                </div>

                <div class="config-grid">
                    <!-- Project Name -->
                    <div class="config-item wide">
                        <label for="proj-name">Project Name</label>
                        <input type="text" id="proj-name" value="SLICE 1">
                    </div>

                    <!-- Physical Dimensions -->
                    <div class="config-item">
                        <label>Physical Width (cm)</label>
                        <input type="number" id="phys-width" value="1355" step="0.1">
                    </div>
                    <div class="config-item">
                        <label>Physical Height (cm)</label>
                        <input type="number" id="phys-height" step="0.1">
                    </div>

                    <!-- Projector Resolutions -->
                    <div class="config-item">
                        <label>Projector Res W (px)</label>
                        <input type="number" id="proj-width" value="1920">
                    </div>
                    <div class="config-item">
                        <label>Projector Res H (px)</label>
                        <input type="number" id="proj-height" value="1200">
                    </div>
                </div>

                <div class="presets-row">
                    <span class="preset-label">Presets:</span>
                    <button class="btn-preset" data-w="1920" data-h="1200">WUXGA</button>
                    <button class="btn-preset" data-w="1920" data-h="1080">FHD</button>
                    <button class="btn-preset" data-w="3840" data-h="2160">4K</button>
                </div>
            </section>

            <!-- 2. Dashboard Grid (Bottom) -->
            <div class="dashboard-grid">

                <!-- Card A: Content Production (Main Visual) -->
                <section class="card content-card">
                    <div class="card-header">
                        <h2>Digital Content Slice</h2>
                        <div class="usage-badge" id="meta-usage">0% Usage</div>
                    </div>

                    <div class="result-display-large">
                        <div class="res-value">
                            <span id="res-width">0</span>
                            <span class="x-sep">×</span>
                            <span id="res-height">0</span>
                            <span class="unit">px</span>
                        </div>
                        <div class="ar-tag">Aspect Ratio <span id="meta-par">-</span></div>
                    </div>

                    <div class="visualization-container">
                        <div class="projector-frame" id="viz-frame">
                            <div class="content-slice" id="viz-slice">
                                <span class="viz-label">Content</span>
                            </div>
                            <span class="frame-label">Projector Frame</span>
                        </div>
                    </div>

                    <div class="actions">
                        <button id="btn-download" class="btn-primary full-width">
                            <span class="icon">⬇</span> Download Calibration Pattern
                        </button>
                    </div>
                </section>

                <!-- Tools Column -->
                <div class="tools-column">

                    <!-- Card B: Lens Calculator -->
                    <section class="card tool-card lens-card">
                        <h2>Lens Throw Calculator</h2>
                        <div class="tool-content">
                            <div class="input-group">
                                <label for="distance-m">Throw Distance (meters)</label>
                                <input type="number" id="distance-m" placeholder="e.g. 10" step="0.1" value="10">
                            </div>
                            <div class="tool-result highlight">
                                <div class="tr-row">
                                    <span class="label">Throw Ratio:</span>
                                    <span class="value" id="res-tr">0.00</span>
                                </div>
                                <div class="rec-row" id="res-lens">Waiting for input...</div>
                            </div>
                        </div>
                    </section>

                    <!-- Card C: Lumen Calculator -->
                    <section class="card tool-card lumen-card">
                        <h2>Lumen Requirement</h2>
                        <div class="tool-content">
                            <div class="input-group">
                                <label for="lumen-env">Theater Ambience</label>
                                <select id="lumen-env">
                                    <option value="15">Pitch Dark (15 fL)</option>
                                    <option value="30">Control Booth (30 fL)</option>
                                    <option value="50" selected>Normal / Bright (50 fL)</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="lumen-gain">Screen Gain</label>
                                <input type="number" id="lumen-gain" value="1.0" step="0.1">
                            </div>
                            <div class="tool-result">
                                <span class="label">Recommended ANSI:</span>
                                <span class="value large" id="res-lumens">0</span>
                            </div>
                        </div>
                    </section>

                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
